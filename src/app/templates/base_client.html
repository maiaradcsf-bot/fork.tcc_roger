<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Área do Cliente{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='client.css') }}" />
  </head>
  <body class="bg-light">
    <div class="container-fluid px-0">
      <div class="row gx-0 min-vh-100">
        <aside class="col-lg-3 col-xl-2 bg-white vh-lg-100 p-4">
          <div class="d-flex align-items-center mb-4">
            <div class="rounded-3 bg-primary text-white d-inline-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px; font-weight: 700;">
              C
            </div>
            <div>
              <h5 class="mb-0">Área do Cliente</h5>
              <small class="text-muted">Acesso do Cliente</small>
            </div>
          </div>

          <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action {% if active_page == 'client_dashboard' %}active{% endif %}" href="{{ url_for('views.client_dashboard') }}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="list-group-item list-group-item-action {% if active_page == 'client_products' %}active{% endif %}" href="{{ url_for('views.client_products') }}"><i class="bi bi-box-seam me-2"></i> Produtos</a>
            <a class="list-group-item list-group-item-action {% if active_page == 'client_orders' %}active{% endif %}" href="{{ url_for('views.client_meus_pedidos') }}"><i class="bi bi-card-checklist me-2"></i> Meus Pedidos</a>
            <div class="mt-3"></div>
            <button id="clientLogoutButton" class="btn btn-outline-danger w-100">Sair</button>
          </div>
        </aside>

        <main class="col-lg-9 col-xl-10 px-3 px-lg-4 py-4">
          <div id="alertContainer"></div>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='client.js') }}"></script>
    <script>
      document.getElementById('clientLogoutButton')?.addEventListener('click', clientLogout);
    </script>
  </body>
</html>
