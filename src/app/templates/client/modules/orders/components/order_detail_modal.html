<div class="modal fade" id="clientOrderDetailModal" tabindex="-1" aria-labelledby="clientOrderDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="clientOrderDetailModalLabel">Detalhes da Solicitação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-3 align-items-start">
          <div class="col-md-6">
            <h6 class="text-uppercase text-secondary small mb-2">Cliente</h6>
            <p id="clientOrderDetailClient" class="h5 fw-bold text-dark mb-2">--</p>
            <div id="clientOrderDetailStatus" class="mb-0"></div>
          </div>
          <div class="col-md-6">
            <h6 class="text-uppercase text-secondary small mb-2">Resumo</h6>
            <p class="mb-1"><strong>Total:</strong> <span id="clientOrderDetailTotal">R$ 0,00</span></p>
            <p class="mb-1"><strong>Solicitado em:</strong> <span id="clientOrderDetailCreatedAt">--</span></p>
          </div>
        </div>
        <div class="row mb-4">
          <div class="col-12">
            <p class="mb-2 d-none" id="clientOrderDetailReasonRow"><strong>Motivo:</strong> <span id="clientOrderDetailReason">--</span></p>
          </div>
        </div>
        <div class="row mb-4">
          <div class="col-12">
            <div id="clientOrderDetailAudit" class="border rounded-3 p-3 bg-light">
              <p class="mb-0 text-muted">Carregando histórico...</p>
            </div>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-borderless align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Produto</th>
                <th>Descrição</th>
                <th>Código de Barras</th>
                <th>Quantidade</th>
                <th>Valor unitário</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody id="clientOrderDetailItemsBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
