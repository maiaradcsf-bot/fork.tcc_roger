{% extends "client/base_client.html" %}
{% block title %}Perfil - Cliente{% endblock %}
{% block heading %}Perfil{% endblock %}
{% block description %}Atualize seus dados de contato, senha e foto de perfil.{% endblock %}
{% block content %}
  <div class="row">
    <div class="col-lg-8">
      <div class="card mb-4">
        <div class="card-body">
          <form id="clientProfileForm" class="row g-3">
            <div class="col-md-6">
              <label for="clientProfileName" class="form-label">Nome</label>
              <input type="text" id="clientProfileName" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label for="clientProfileEmail" class="form-label">E-mail</label>
              <input type="email" id="clientProfileEmail" class="form-control" required />
            </div>
            <div class="col-md-6">
              <label for="clientProfilePhone" class="form-label">Telefone</label>
              <input type="tel" id="clientProfilePhone" class="form-control" />
            </div>
            <div class="col-12">
              <label for="clientProfilePhoto" class="form-label">Foto de perfil</label>
              <input type="file" id="clientProfilePhoto" class="form-control" accept="image/*" />
              <div id="clientProfilePhotoPreview" class="mt-3"></div>
            </div>
            <div class="col-md-6">
              <label for="clientProfilePassword" class="form-label">Nova senha</label>
              <input type="password" id="clientProfilePassword" class="form-control" placeholder="Deixe em branco para manter a senha atual" />
            </div>
            <div class="col-md-6">
              <label for="clientProfilePasswordConfirm" class="form-label">Confirmar senha</label>
              <input type="password" id="clientProfilePasswordConfirm" class="form-control" placeholder="Repita a nova senha" />
            </div>
            <div class="col-12 text-end">
              <button type="submit" class="btn btn-primary" data-permission="clients.profile.edit">Salvar alterações</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
