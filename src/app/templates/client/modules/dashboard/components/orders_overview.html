<section class="row g-3">
  <div class="col-12 col-xl-8">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-3">
          <div>
            <h2 class="h5 mb-1">Solicitações por dia</h2>
          </div>
          <div class="btn-group btn-group-sm" role="group" aria-label="Período do gráfico">
            <button type="button" class="btn btn-primary client-orders-range-button" data-range-days="7">7 dias</button>
            <button type="button" class="btn btn-outline-primary client-orders-range-button" data-range-days="15">15 dias</button>
            <button type="button" class="btn btn-outline-primary client-orders-range-button" data-range-days="30">30 dias</button>
            <button type="button" class="btn btn-outline-primary client-orders-range-button" data-range-days="60">60 dias</button>
          </div>
        </div>
        <div class="position-relative" style="height: 320px;">
          <canvas id="clientOrdersChart" height="320" aria-label="Gráfico de solicitações por data"></canvas>

        </div>
      </div>
    </div>
  </div>

  <div class="col-12 col-xl-4">
    <div class="card shadow-sm h-100">
      <div class="card-body">
        <h2 class="h5 mb-3">Resumo rápido</h2>
        <div class="row g-3">
          <div class="col-6">
            <div class="border rounded-3 p-3 bg-light h-100">
              <div class="text-muted small">Itens solicitados</div>
              <div class="fs-4 fw-semibold" id="clientTotalQuantity">—</div>
            </div>
          </div>
          <div class="col-6">
            <div class="border rounded-3 p-3 bg-light h-100">
              <div class="text-muted small">Valor total</div>
              <div class="fs-4 fw-semibold" id="clientTotalValue">—</div>
            </div>
          </div>
          <div class="col-12">
            <div class="border rounded-3 p-3 bg-light">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted small">Solicitações no período</span>
                <strong id="clientPeriodOrdersCount">—</strong>
              </div>
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-muted small">Itens no período</span>
                <strong id="clientPeriodItemsCount">—</strong>
              </div>
            </div>
          </div>
          <div class="col-12">
            <a href="{{ url_for('views.client_products') }}" class="btn btn-primary w-100">
              <i class="bi bi-plus-circle me-1"></i> Nova solicitação
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
