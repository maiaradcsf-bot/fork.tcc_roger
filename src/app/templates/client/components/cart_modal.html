<div class="modal fade" id="clientCartModal" tabindex="-1" aria-labelledby="clientCartModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="clientCartModalLabel">Resumo da Requisição</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Valor unitário</th>
                <th>Subtotal</th>
                <th class="text-center">Ações</th>
              </tr>
            </thead>
            <tbody id="clientCartItemsBody">
              <tr>
                <td colspan="5" class="text-center py-4 text-muted">Carrinho vazio.</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-end mt-3">
          <div class="fs-5 fw-semibold">Total: <span id="clientCartTotal">R$ 0,00</span></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        <button type="button" class="btn btn-primary" id="confirmClientCartButton">Confirmar solicitação</button>
      </div>
    </div>
  </div>
</div>
