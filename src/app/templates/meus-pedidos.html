{% extends "base_client.html" %}
{% block title %}Meus Pedidos{% endblock %}
{% block heading %}Meus Pedidos{% endblock %}
{% block description %}Histórico das suas solicitações.{% endblock %}
{% block content %}
  <section class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>#</th>
              <th>Produto</th>
              <th>Quantidade</th>
              <th>E-mail</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <tr>
              <td colspan="5" class="text-center py-4 text-muted">Carregando histórico...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="text-center mt-3">
        <button class="btn btn-danger" onclick="clearHistory()">Limpar Histórico</button>
      </div>
    </div>
  </section>

  <script src="{{ url_for('static', filename='meus-pedidos.js') }}"></script>
{% endblock %}
