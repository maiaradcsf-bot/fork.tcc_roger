<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Painel Admin - Almoxarifado{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}" />
  </head>
  <body class="bg-light">
    <div class="container-fluid px-0">
      <div class="row gx-0 min-vh-100">
        <aside class="col-lg-3 col-xl-2 bg-dark text-white vh-lg-100 p-4">
          <div class="d-flex align-items-center mb-4">
            <div class="rounded-3 bg-white text-dark d-inline-flex align-items-center justify-content-center me-3" style="width: 48px; height: 48px; font-weight: 700;">
              A
            </div>
            <div>
              <h5 class="mb-0">Almoxarifado</h5>
              <small class="text-white-50">Painel Admin</small>
            </div>
          </div>

          <div class="list-group list-group-flush">
            <a class="list-group-item list-group-item-action bg-dark text-white {% if active_page == 'dashboard' %}active{% endif %}" href="{{ url_for('views.dashboard') }}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
            <a class="list-group-item list-group-item-action bg-dark text-white {% if active_page == 'orders' %}active{% endif %}" href="{{ url_for('views.orders') }}"><i class="bi bi-card-checklist me-2"></i> Solicitações</a>
            <a class="list-group-item list-group-item-action bg-dark text-white {% if active_page == 'categories' %}active{% endif %}" href="{{ url_for('views.categories') }}"><i class="bi bi-tags me-2"></i> Categorias</a>
            <a class="list-group-item list-group-item-action bg-dark text-white {% if active_page == 'products' %}active{% endif %}" href="{{ url_for('views.products') }}"><i class="bi bi-box-seam me-2"></i> Produtos</a>
            <a class="list-group-item list-group-item-action bg-dark text-white {% if active_page == 'clients' %}active{% endif %}" href="{{ url_for('views.clients') }}"><i class="bi bi-people me-2"></i> Clientes</a>
            <a class="list-group-item list-group-item-action bg-dark text-white {% if active_page == 'settings' %}active{% endif %}" href="{{ url_for('views.settings') }}"><i class="bi bi-gear me-2"></i> Configurações</a>
          </div>
        </aside>

        <main class="col-lg-9 col-xl-10 px-3 px-lg-4 py-4">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
            <div>
              <h1 class="h3 mb-1">{% block heading %}Painel Administrativo{% endblock %}</h1>
              <p class="text-muted mb-0">{% block description %}Use o menu à esquerda para navegar entre os módulos do almoxarifado.{% endblock %}</p>
            </div>
            <button id="logoutButton" class="btn btn-outline-secondary">Sair</button>
          </div>

          <div id="alertContainer"></div>
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='admin.js') }}"></script>
  </body>
</html>
