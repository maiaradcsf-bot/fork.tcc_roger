<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastro - Almoxarifado</title>
    <link rel="icon" type="image/webp" href="{{ url_for('static', filename='favicon.webp') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  </head>
  <body class="bg-light">
    <main class="min-vh-100 d-flex align-items-center">
      <div class="container py-5">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-7 col-xl-5">
            <div class="card shadow-sm border-0">
              <div class="card-body p-4 p-lg-5">
                <div class="text-center mb-4">
                  <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center rounded-circle bg-success text-white" style="width: 56px; height: 56px;">
                    <i class="bi bi-person-plus fs-4"></i>
                  </div>
                  <h1 class="h4 mb-1">Cadastro</h1>
                  <p class="text-muted mb-0">Crie sua conta para acessar as funcionalidades do sistema.</p>
                </div>

                <div id="alertContainer"></div>

                <form id="registerForm" class="row g-3">
                  <div class="col-12">
                    <label for="name" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" id="name" placeholder="Maria Silva" required />
                  </div>
                  <div class="col-12">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="maria@example.com" required />
                  </div>
                  <div class="col-12">
                    <label for="phone" class="form-label">Telefone</label>
                    <input type="tel" class="form-control" id="phone" placeholder="(00) 90000-0000" />
                  </div>
                  <div class="col-12">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••" required />
                  </div>
                  <div class="col-12 d-grid">
                    <button id="registerButton" type="submit" class="btn btn-success btn-lg">
                      <i class="bi bi-person-plus me-2"></i> Criar conta
                    </button>
                  </div>
                </form>

                <div class="text-center text-muted mt-4">
                  Já tem conta? <a href="{{ url_for('views.index') }}">Entrar</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
  </body>
</html>
