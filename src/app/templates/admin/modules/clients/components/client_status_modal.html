<div class="modal fade" id="clientDeactivateModal" tabindex="-1" aria-labelledby="clientDeactivateModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="clientDeactivateModalLabel">Inativar Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <p id="clientDeactivateMessage">Deseja alterar o status do cliente <strong id="clientDeactivateName"></strong>?</p>
        <p class="text-muted small">A ativação/desativação será aplicada imediatamente no cadastro.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button id="confirmDeactivateClientButton" type="button" class="btn btn-danger">Confirmar</button>
      </div>
    </div>
  </div>
</div>
