<section class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-3">
      <div>
        <h2 class="h5 mb-1">Produtos</h2>
      </div>
      <div class="btn-group flex-wrap">
        <button id="newProductButton" class="btn btn-success" data-permission="admin.products.create">
          <i class="bi bi-plus-lg me-1"></i> Novo produto
        </button>
        <button id="importProductsButton" class="btn btn-outline-success" data-permission="admin.products.import">
          <i class="bi bi-file-earmark-arrow-up me-1"></i> Importar produtos
        </button>
        <button id="exportProductsButton" class="btn btn-outline-secondary" data-permission="admin.products.list">
          <i class="bi bi-file-earmark-arrow-down me-1"></i> Exportar produtos
        </button>
        <button id="viewStockMovesButton" class="btn btn-secondary" data-permission="admin.stock.moves.list">
          <i class="bi bi-archive me-1"></i> Ver movimentações estoque
        </button>
        <!-- Botão de nova movimentação removido daqui; mantenha criação via página de Movimentações -->
        <button id="refreshProductsButton" class="btn btn-outline-primary" data-permission="admin.products.list">
          <i class="bi bi-arrow-repeat me-1"></i> Atualizar produtos
        </button>
      </div>
      <input type="file" id="importProductsFileInput" accept=".csv,text/csv" class="d-none" />
    </div>

    <div class="table-responsive mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Produto</th>
            <th>Código de Barras</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Estoque Atual</th>
            <th>Mín.</th>
            <th>Máx.</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="productsTableBody" class="table-placeholder">
          <tr>
            <td colspan="9" class="text-center py-5 text-muted">Carregando produtos...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Movimentações de Estoque movidas para sua própria página -->
  </div>
</section>
