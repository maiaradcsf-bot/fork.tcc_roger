<section class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-3">
      <div>
        <h2 class="h5 mb-1">Produtos</h2>
        <p class="text-muted mb-0">Gerencie produtos e avalie o estoque atual.</p>
      </div>
      <div class="btn-group flex-wrap">
        <button id="newProductButton" class="btn btn-success">
          <i class="bi bi-plus-lg me-1"></i> Novo produto
        </button>
        <button id="newStockMoveButton" class="btn btn-warning text-dark">
          <i class="bi bi-arrow-up-right-square me-1"></i> Nova movimentação
        </button>
        <button id="refreshProductsButton" class="btn btn-outline-primary">
          <i class="bi bi-arrow-repeat me-1"></i> Atualizar produtos
        </button>
      </div>
    </div>

    <div class="table-responsive mb-4">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Produto</th>
            <th>Preço</th>
            <th>Estoque</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="productsTableBody" class="table-placeholder">
          <tr>
            <td colspan="5" class="text-center py-5 text-muted">Carregando produtos...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="table-responsive">
      <h3 class="h6 mb-3">Movimentações de Estoque</h3>
      <table class="table table-sm table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Motivo</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody id="stockMovesTableBody" class="table-placeholder">
          <tr>
            <td colspan="4" class="text-center py-5 text-muted">Carregando movimentações...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
