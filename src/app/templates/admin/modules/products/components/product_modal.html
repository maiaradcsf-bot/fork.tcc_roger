<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="productModalLabel">Novo Produto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="productForm">
        <div class="modal-body">
          <input type="hidden" id="productId" />
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="productName" class="form-label">Nome</label>
              <input type="text" id="productName" class="form-control" required />
            </div>
            <div class="col-12 col-md-6">
              <label for="productPrice" class="form-label">Preço</label>
              <input type="number" id="productPrice" class="form-control" step="0.01" required />
            </div>
            <div class="col-12">
              <label for="productDescription" class="form-label">Descrição</label>
              <textarea id="productDescription" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-12 col-md-6">
              <label for="productPhoto" class="form-label">Imagem do produto</label>
              <input type="file" id="productPhoto" class="form-control" accept="image/*" />
              <div id="productPhotoPreview" style="margin-top: 8px;"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="productStock" class="form-label">Estoque inicial</label>
              <input type="number" id="productStock" class="form-control" min="0" value="0" />
              <div class="form-text">Quantidade inicial para o produto.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar produto</button>
        </div>
      </form>
    </div>
  </div>
</div>
