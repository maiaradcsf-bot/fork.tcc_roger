<div class="modal fade" id="settingsProfileModal" tabindex="-1" aria-labelledby="settingsProfileModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="settingsProfileModalLabel">Novo Perfil</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="settingsProfileForm">
        <input type="hidden" id="settingsProfileId" />
        <div class="modal-body">
          <div class="row gy-3">
            <div class="col-12 col-md-6">
              <label for="settingsProfileName" class="form-label">Nome do perfil</label>
              <input type="text" id="settingsProfileName" class="form-control" required />
            </div>
            <div class="col-12 col-md-6">
              <label for="settingsProfileDescription" class="form-label">Descrição</label>
              <input type="text" id="settingsProfileDescription" class="form-control" />
            </div>
            <div class="col-12">
              <label class="form-label">Permissões</label>
              <div id="settingsProfilePermissionsSelect" class="border rounded p-2" style="max-height: 260px; overflow-y: auto;"></div>
              <div class="form-text">Marque cada permissão individualmente. Clicar em uma não afeta as demais.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar perfil</button>
        </div>
      </form>
    </div>
  </div>
</div>
