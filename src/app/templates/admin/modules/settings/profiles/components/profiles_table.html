<div class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h2 class="h5 mb-1">Perfis de acesso</h2>
      </div>
      <div class="btn-group">
        <button id="newSettingsProfileButton" class="btn btn-primary">
          <i class="bi bi-person-badge-fill me-1"></i> Novo perfil
        </button>
        <button id="refreshSettingsProfilesButton" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-repeat me-1"></i> Atualizar
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Perfil</th>
            <th>Descrição</th>
            <th>Permissões</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="settingsProfilesTableBody" class="table-placeholder">
          <tr>
            <td colspan="5" class="text-center py-5 text-muted">Carregando perfis...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
