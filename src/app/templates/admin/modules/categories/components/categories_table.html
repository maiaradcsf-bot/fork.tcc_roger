<section class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-3">
      <div>
        <h2 class="h5 mb-1">Categorias</h2>
        <p class="text-muted mb-0">Crie, edite e exclua categorias de produto.</p>
      </div>
      <div class="btn-group">
        <button id="newCategoryButton" class="btn btn-success">
          <i class="bi bi-plus-lg me-1"></i> Nova categoria
        </button>
        <button id="refreshCategoriesButton" class="btn btn-outline-primary">
          <i class="bi bi-arrow-repeat me-1"></i> Atualizar categorias
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>Tipo</th>
            <th>Descrição</th>
            <th>Categoria</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="categoriesTableBody" class="table-placeholder">
          <tr>
            <td colspan="6" class="text-center py-5 text-muted">Carregando categorias...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
