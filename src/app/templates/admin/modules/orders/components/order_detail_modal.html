<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-labelledby="orderDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="orderDetailModalLabel">Detalhes da Solicitação</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-4">
          <div class="col-md-6">
            <h6>Cliente</h6>
            <p id="orderDetailClient" class="mb-1">--</p>
            <p id="orderDetailStatus" class="mb-0"></p>
          </div>
          <div class="col-md-6 text-md-end">
            <h6>Resumo</h6>
            <p class="mb-1"><strong>Total:</strong> <span id="orderDetailTotal">R$ 0,00</span></p>
             <p class="mb-1"><strong>Motivo:</strong> <span id="orderDetailReason">--</span></p>
            <p class="mb-0"><strong>Solicitado em:</strong> <span id="orderDetailCreatedAt">--</span></p>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-borderless align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Produto</th>
                <th>Descrição</th>
                <th>Imagem</th>
                <th>Quantidade</th>
                <th>Valor unitário</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody id="orderDetailItemsBody"></tbody>
          </table>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
      </div>
    </div>
  </div>
</div>
