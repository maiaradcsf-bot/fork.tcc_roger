<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='main.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>

<body class="login"
      style="
        background-image: url('{{ url_for('static', filename='imagens/industria-4.0.png') }}');
        background-position:center;
        background-repeat: no-repeat;
        background-size: contain;
        background-attachment: fixed;
        
      ">

    <h1>Almoxarifado</h1>

    <div class="login-container">

        <form id="login-form">

            <!-- Usuario -->
            <div class="mb-3">
                <label for="usuario" class="form-label">
                    Login:
                </label>

                <input type="text"
                       placeholder="Usuário"
                       class="form-control"
                       id="usuario">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">
                    Senha:
                </label>

                <input type="password"
                       placeholder="Senha"
                       class="form-control"
                       id="password">
            </div>

            <button type="button"
                    class="btn btn-primary"
                    onclick="verificar_login()">
                Entrar
            </button>

        </form>

        <hr>

        <form id="register-form">
            <h2 class="h5 mb-3">Criar usuário</h2>

            <div class="mb-3 text-start">
                <label for="new-usuario" class="form-label">
                    Nome do usuário:
                </label>
                <input type="text"
                       placeholder="Nome do usuário"
                       class="form-control"
                       id="new-usuario">
            </div>

            <div class="mb-3 text-start">
                <label for="new-password" class="form-label">
                    Senha:
                </label>
                <input type="password"
                       placeholder="Senha"
                       class="form-control"
                       id="new-password">
            </div>

            <div class="form-check mb-3 text-start">
                <input class="form-check-input"
                       type="checkbox"
                       id="is-admin">
                <label class="form-check-label" for="is-admin">
                    Administrador
                </label>
            </div>

            <button type="button"
                    class="btn btn-success"
                    onclick="criarUsuario()">
                Criar usuário
            </button>
        </form>

    </div>

</body>

</html>
