<section class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-3">
      <div>
        <h2 class="h5 mb-1">Lista de solicitações</h2>
        <p class="text-muted mb-0">Use as ações abaixo para aprovar ou marcar como retirado.</p>
      </div>
      <button id="refreshOrdersButton" class="btn btn-primary"  data-permission="admin.orders.list" >
        <i class="bi bi-arrow-clockwise me-1"></i> Atualizar pedidos
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Cliente</th>
            <th>Produtos</th>
            <th>Quantidade</th>
            <th>Total</th>
            <th>Status</th>
            <th>Solicitado em</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody" class="table-placeholder">
          <tr>
            <td colspan="8" class="text-center py-5 text-muted">Carregando pedidos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
