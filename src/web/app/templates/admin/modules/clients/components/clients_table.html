<section class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-3 gap-3">
      <div>
        <h2 class="h5 mb-1">Clientes</h2>
        <p class="text-muted mb-0">Lista de clientes com dados de contato, histórico de pedidos e resumos.</p>
      </div>
      <button id="refreshClientsButton" class="btn btn-outline-primary"  data-permission="admin.clients.list">
        <i class="bi bi-arrow-repeat me-1"></i> Atualizar clientes
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Telefone</th>
            <th>Status</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="clientsTableBody" class="table-placeholder">
          <tr>
            <td colspan="6" class="text-center py-5 text-muted">Carregando clientes...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
