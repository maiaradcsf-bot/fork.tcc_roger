<div class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h2 class="h5 mb-1">Usuários administrativos</h2>
        <p class="text-muted mb-0">Gerencie contas de acesso e atribua perfis de usuário.</p>
      </div>
      <div class="btn-group">
        <button id="newSettingsUserButton" class="btn btn-primary">
          <i class="bi bi-person-plus-fill me-1"></i> Novo usuário
        </button>
        <button id="refreshSettingsUsersButton" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-repeat me-1"></i> Atualizar
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Usuário</th>
            <th>E-mail</th>
            <th>Perfis</th>
            <th>Cadastro</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="settingsUsersTableBody" class="table-placeholder">
          <tr>
            <td colspan="6" class="text-center py-5 text-muted">Carregando usuários...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
