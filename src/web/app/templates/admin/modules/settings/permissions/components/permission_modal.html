<div class="modal fade" id="settingsPermissionModal" tabindex="-1" aria-labelledby="settingsPermissionModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="settingsPermissionModalLabel">Nova Permissão</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <form id="settingsPermissionForm">
        <input type="hidden" id="settingsPermissionId" />
        <div class="modal-body">
          <div class="mb-3">
            <label for="settingsPermissionName" class="form-label">Nome</label>
            <input type="text" id="settingsPermissionName" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="settingsPermissionDescription" class="form-label">Descrição</label>
            <textarea id="settingsPermissionDescription" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar permissão</button>
        </div>
      </form>
    </div>
  </div>
</div>
