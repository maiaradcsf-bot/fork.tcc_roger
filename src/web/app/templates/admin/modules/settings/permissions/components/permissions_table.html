<div class="card shadow-sm mb-4">
  <div class="card-body">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h2 class="h5 mb-1">Permissões do sistema</h2>
        <p class="text-muted mb-0">Crie e edite permissões que podem ser atribuídas a perfis.</p>
      </div>
      <div class="btn-group">
        <button id="newSettingsPermissionButton" class="btn btn-primary">
          <i class="bi bi-plus-lg me-1"></i> Nova permissão
        </button>
        <button id="refreshSettingsPermissionsButton" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-repeat me-1"></i> Atualizar
        </button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Permissão</th>
            <th>Descrição</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="settingsPermissionsTableBody" class="table-placeholder">
          <tr>
            <td colspan="4" class="text-center py-5 text-muted">Carregando permissões...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
