name: tcc_sesi
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    networks:
      - network_tcc
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - vol_database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    # Image built from the Dockerfile; the entrypoint applies migrations and the seed on start
    build: .
    image: tcc_sesi_app
    container_name: app
    restart: unless-stopped
    networks:
      - network_tcc
    volumes:
      - vol_images:/app/app/static/uploads
    environment:
      - FLASK_APP=${FLASK_APP}
      # Debug mode stays off: it exposes the Werkzeug debugger (code execution) on the public port
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
      - PYTHONDONTWRITEBYTECODE=${PYTHONDONTWRITEBYTECODE}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Optional: password of the initial admin account created by the seed (default dev@123)
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Optional: Groq API key for the AI assistant (empty = assistant hidden)
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
    expose:
      - "5000"
    depends_on:
      mysql:
        condition: service_healthy

  proxy:
    image: nginx:latest
    container_name: proxy
    restart: always
    networks:
      - network_tcc
    ports:
      - "80:80"
    volumes:
      - ./.docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    networks:
      - network_tcc
    # No PMA_USER/PMA_PASSWORD: phpMyAdmin asks for the MySQL login instead of opening already
    # authenticated. Published on localhost only; set PMA_BIND_ADDRESS to expose it elsewhere.
    environment:
      PMA_HOST: ${PMA_HOST}
    ports:
      - "${PMA_BIND_ADDRESS:-127.0.0.1}:8080:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  vol_database:
    name: banco_de_dados_tcc
  vol_images:
    name: imagens_tcc
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./.docker/imagens

networks:
  network_tcc:
    driver: bridge
